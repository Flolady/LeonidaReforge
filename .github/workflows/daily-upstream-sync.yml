name: Sync fork with upstream

on:
  schedule:
    # Daily at 02:17 UTC (10:17 China Standard Time)
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Flolady/LeonidaReforge'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward from upstream
        shell: bash
        run: |
          git remote add upstream https://github.com/LeonidaReforge/Leonida.git
          git fetch upstream main
          git merge --ff-only upstream/main
          git push origin main
